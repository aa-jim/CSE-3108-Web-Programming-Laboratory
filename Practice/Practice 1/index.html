<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkinRoute</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@100;400;600;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div class="navbar">
      <div class="nav-logo">SkinRoute</div>
      <div class="nav-buttons">
        <button id="home">
          <i data-lucide="home"></i>
        </button>
        <button id="help" style="font-size: 1.5rem; font-weight: 700">?</button>
        <button id="bug">
          <i data-lucide="bug"></i>
        </button>
      </div>
    </div>
    <div class="hero">
      <div class="hero-text">
        <h1 class="heading">Plan cheapest path to your favorite skin</h1>
        <p class="sub-heading">
          Enter resources, select target, get day by day plan + downloadable PDF
        </p>
      </div>
      <div class="event-cards">
        <div id="card1">event1</div>
        <div id="card2">event2</div>
        <div id="card3">event3</div>
      </div>
    </div>
    <footer>Made by mlbb player, for mlbb players.</footer>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
